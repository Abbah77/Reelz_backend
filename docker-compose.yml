version: "3.9"

services:
  reelz-backend:
    build: .
    container_name: reelz-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    depends_on:
      - flaresolverr
    restart: unless-stopped
    networks:
      - reelz

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: reelz-flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - reelz

networks:
  reelz:
    driver: bridge
